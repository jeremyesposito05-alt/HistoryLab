name: Build HistoryLab app icon

on:
  push:
    branches: [main]
    paths:
      - icon-192.png

permissions:
  contents: write

jobs:
  build-icon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 512 icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert icon-192.png -filter Lanczos -resize 512x512 icon-512.png
      - name: Commit 512 icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png
          git diff --cached --quiet || git commit -m "HistoryLab V7.14: build 512 app icon"
          git push
